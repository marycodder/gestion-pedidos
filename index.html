<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Pedidos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Gestión de pedidos, producción y entregas</a>
        </div>
    </nav>

    <main class="container my-5">

        <h1 class="mb-4">Panel de gestión</h1>

        <div class="row g-4">

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2>0</h2>
                        <p class="mb-0">Pedidos</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2>0</h2>
                        <p class="mb-0">En producción</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2>0</h2>
                        <p class="mb-0">Listos</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2>$0</h2>
                        <p class="mb-0">Ventas</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2>0</h2>
                        <p class="mb-0">Entregados</p>
                    </div>
                </div>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/app.js"></script>

</body>
</html>
